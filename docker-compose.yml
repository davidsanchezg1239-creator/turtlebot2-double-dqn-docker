version: '3'
services:
  turtlebot_ddqn:
    build: .
    environment:
      # If you are using VcXsrv on Windows, you might need to change this to host.docker.internal:0
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    # This command starts the training exactly as the tutorial requests
    command: /bin/bash -c "roslaunch fa_turtlebot start_training.launch"
    network_mode: "host"
    privileged: true
